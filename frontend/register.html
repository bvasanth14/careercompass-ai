<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CareerCompass-AI</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- DotLottie Web Component CDN -->
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d0714; }
        ::-webkit-scrollbar-thumb { background: #2d164d; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff2a85; }

        /* Neon Glow Effects */
        .neon-glow {
            box-shadow: 0 0 35px rgba(255, 42, 133, 0.25);
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 4s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-[#0d0714] text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 py-12 selection:bg-[#ff2a85] selection:text-white relative overflow-x-hidden">

    <!-- Ambient Background Glows -->
    <div class="absolute top-1/4 -left-20 w-96 h-96 bg-[#ff2a85]/15 rounded-full blur-[120px] pointer-events-none animate-pulse-slow"></div>
    <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-[#7928ca]/20 rounded-full blur-[120px] pointer-events-none animate-pulse-slow"></div>

    <main class="w-full max-w-lg relative z-10 my-auto">

        <!-- Logo / Branding Header -->
        <div class="text-center mb-6 space-y-2">
            <div class="inline-flex p-3 rounded-2xl bg-gradient-to-br from-[#ff2a85] to-[#7928ca] text-white shadow-lg shadow-[#ff2a85]/30 mb-1">
                <i data-lucide="compass" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-extrabold tracking-wide text-white">
                CareerCompass<span class="text-[#ff2a85]">AI</span>
            </h2>
        </div>

        <!-- Auth Card Container -->
        <section class="p-8 rounded-3xl bg-[#170c28]/90 backdrop-blur-xl border border-white/10 shadow-2xl neon-glow space-y-6">

            <!-- DotLottie Web Component Animation -->
            <div class="flex justify-center -mb-2">
                <dotlottie-wc 
                    src="https://lottie.host/4a53e346-ef29-4988-acfe-57364a961274/A0lK8Q2qg4.lottie" 
                    style="width: 120px; height: 120px;" 
                    autoplay 
                    loop>
                </dotlottie-wc>
            </div>

            <div class="space-y-1 text-center">
                <h1 class="text-2xl font-bold text-white tracking-tight">Create Account</h1>
                <p class="text-slate-400 text-sm">Start your AI-powered career journey</p>
            </div>

            <!-- Alert Box for Notifications -->
            <div id="alert-msg" class="hidden p-4 rounded-xl text-xs font-semibold leading-relaxed transition-all"></div>

            <!-- Registration Form -->
            <form id="registerForm" class="space-y-4">

                <!-- Full Name -->
                <div class="space-y-1.5">
                    <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                        Full Name
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input 
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#10061e] border border-white/10 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-[#ff2a85] focus:ring-1 focus:ring-[#ff2a85] transition-all"
                        >
                    </div>
                </div>

                <!-- Email -->
                <div class="space-y-1.5">
                    <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                        Email
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </div>
                        <input 
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#10061e] border border-white/10 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-[#ff2a85] focus:ring-1 focus:ring-[#ff2a85] transition-all"
                        >
                    </div>
                </div>

                <!-- Department -->
                <div class="space-y-1.5">
                    <label for="department" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                        Department
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="building-2" class="w-4 h-4"></i>
                        </div>
                        <input 
                            type="text"
                            id="department"
                            placeholder="Example: Information Technology"
                            required
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#10061e] border border-white/10 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-[#ff2a85] focus:ring-1 focus:ring-[#ff2a85] transition-all"
                        >
                    </div>
                </div>

                <!-- Password Input with Show/Hide Toggle -->
                <div class="space-y-1.5">
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                        Password
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input 
                            type="password"
                            id="password"
                            placeholder="Create password"
                            required
                            class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-[#10061e] border border-white/10 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-[#ff2a85] focus:ring-1 focus:ring-[#ff2a85] transition-all"
                        >
                        <!-- Show/Hide Password Toggle Button -->
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition-colors focus:outline-none"
                            aria-label="Toggle password visibility"
                        >
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <!-- PASSWORD STRENGTH METER & FEEDBACK -->
                    <div id="password-strength-container" class="space-y-2 pt-1 hidden">
                        <!-- Strength Bar & Status -->
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-slate-400">Password Strength:</span>
                            <span id="strength-label" class="font-bold text-slate-400">Weak</span>
                        </div>
                        <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                            <div id="strength-bar" class="h-full w-0 bg-rose-500 transition-all duration-300"></div>
                        </div>

                        <!-- Live Suggestions Checklist -->
                        <div class="p-3 rounded-xl bg-[#10061e] border border-white/5 space-y-1.5 text-[11px]">
                            <div id="rule-length" class="flex items-center gap-1.5 text-slate-500 transition-colors">
                                <i data-lucide="circle-dot" class="w-3.5 h-3.5"></i>
                                <span>At least 8 characters</span>
                            </div>
                            <div id="rule-case" class="flex items-center gap-1.5 text-slate-500 transition-colors">
                                <i data-lucide="circle-dot" class="w-3.5 h-3.5"></i>
                                <span>Mix of uppercase & lowercase letters</span>
                            </div>
                            <div id="rule-number" class="flex items-center gap-1.5 text-slate-500 transition-colors">
                                <i data-lucide="circle-dot" class="w-3.5 h-3.5"></i>
                                <span>At least one number (0-9)</span>
                            </div>
                            <div id="rule-special" class="flex items-center gap-1.5 text-slate-500 transition-colors">
                                <i data-lucide="circle-dot" class="w-3.5 h-3.5"></i>
                                <span>At least one special character (@, $, !, %, *, ?, &)</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password Input with Show/Hide Toggle -->
                <div class="space-y-1.5">
                    <label for="confirmPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                        Confirm Password
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="shield-check" class="w-4 h-4"></i>
                        </div>
                        <input 
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                            class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-[#10061e] border border-white/10 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-[#ff2a85] focus:ring-1 focus:ring-[#ff2a85] transition-all"
                        >
                        <!-- Show/Hide Confirm Password Toggle Button -->
                        <button 
                            type="button" 
                            id="toggleConfirmPassword" 
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition-colors focus:outline-none"
                            aria-label="Toggle confirm password visibility"
                        >
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submit-btn"
                    class="w-full mt-2 py-3.5 px-4 rounded-xl bg-gradient-to-r from-[#ff2a85] to-[#c026d3] hover:from-[#e02376] hover:to-[#a21caf] text-white font-bold text-sm shadow-lg shadow-[#ff2a85]/25 transition-all flex items-center justify-center gap-2 cursor-pointer"
                >
                    <span>Register</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>

            </form>

            <div class="pt-4 border-t border-white/10 text-center">
                <p class="text-xs text-slate-400">
                    Already have an account? 
                    <a href="login.html" class="font-bold text-[#ff2a85] hover:underline hover:text-[#e02376] transition-colors ml-1">
                        Login
                    </a>
                </p>
            </div>

        </section>

    </main>

    <!-- UI Logic, Password Strength, Password Toggle & Redirection Script -->
    <script>
        lucide.createIcons();

        const form = document.getElementById('registerForm');
        const alertMsg = document.getElementById('alert-msg');
        const submitBtn = document.getElementById('submit-btn');

        // Password Elements
        const passwordInput = document.getElementById('password');
        const strengthContainer = document.getElementById('password-strength-container');
        const strengthBar = document.getElementById('strength-bar');
        const strengthLabel = document.getElementById('strength-label');

        // Rules
        const ruleLength = document.getElementById('rule-length');
        const ruleCase = document.getElementById('rule-case');
        const ruleNumber = document.getElementById('rule-number');
        const ruleSpecial = document.getElementById('rule-special');

        // --- SHOW / HIDE PASSWORD TOGGLE LOGIC ---
        function setupPasswordToggle(inputId, toggleBtnId) {
            const input = document.getElementById(inputId);
            const toggleBtn = document.getElementById(toggleBtnId);

            toggleBtn.addEventListener('click', function() {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';

                const icon = toggleBtn.querySelector('i');
                if (icon) {
                    icon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
                    lucide.createIcons();
                }
            });
        }

        setupPasswordToggle('password', 'togglePassword');
        setupPasswordToggle('confirmPassword', 'toggleConfirmPassword');

        // Helper function to update rule UI checkmarks
        function updateRuleUI(element, isPassed) {
            const icon = element.querySelector('i');
            if (isPassed) {
                element.className = "flex items-center gap-1.5 text-emerald-400 font-medium transition-colors";
                if (icon) icon.setAttribute('data-lucide', 'check-circle-2');
            } else {
                element.className = "flex items-center gap-1.5 text-slate-500 transition-colors";
                if (icon) icon.setAttribute('data-lucide', 'circle-dot');
            }
        }

        // Live Password Strength Checker
        passwordInput.addEventListener('input', function() {
            const val = passwordInput.value;

            if (val.length > 0) {
                strengthContainer.classList.remove('hidden');
            } else {
                strengthContainer.classList.add('hidden');
                return;
            }

            // Criteria
            const hasMinLength = val.length >= 8;
            const hasMixCase = /[a-z]/.test(val) && /[A-Z]/.test(val);
            const hasNumber = /\d/.test(val);
            const hasSpecial = /[@$!%*?&]/.test(val);

            // Update individual checklist rules
            updateRuleUI(ruleLength, hasMinLength);
            updateRuleUI(ruleCase, hasMixCase);
            updateRuleUI(ruleNumber, hasNumber);
            updateRuleUI(ruleSpecial, hasSpecial);
            lucide.createIcons();

            // Calculate overall score (0 to 4)
            let score = 0;
            if (hasMinLength) score++;
            if (hasMixCase) score++;
            if (hasNumber) score++;
            if (hasSpecial) score++;

            // Render Bar & Label based on score
            if (score <= 1) {
                strengthBar.style.width = '25%';
                strengthBar.className = 'h-full bg-rose-500 transition-all duration-300';
                strengthLabel.textContent = 'Weak';
                strengthLabel.className = 'font-bold text-rose-400';
            } else if (score === 2) {
                strengthBar.style.width = '50%';
                strengthBar.className = 'h-full bg-amber-500 transition-all duration-300';
                strengthLabel.textContent = 'Fair';
                strengthLabel.className = 'font-bold text-amber-400';
            } else if (score === 3) {
                strengthBar.style.width = '75%';
                strengthBar.className = 'h-full bg-emerald-400 transition-all duration-300';
                strengthLabel.textContent = 'Good';
                strengthLabel.className = 'font-bold text-emerald-400';
            } else {
                strengthBar.style.width = '100%';
                strengthBar.className = 'h-full bg-gradient-to-r from-[#ff2a85] to-emerald-400 transition-all duration-300';
                strengthLabel.textContent = 'Strong 🔥';
                strengthLabel.className = 'font-bold text-[#ff2a85]';
            }
        });

        // --- FORM SUBMIT & BACKEND API CONNECTION ---
        form.addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevent standard page refresh

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const department = document.getElementById('department').value.trim();
            const password = passwordInput.value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Confirm Password Check
            if (password !== confirmPassword) {
                alertMsg.className = "p-4 rounded-xl text-xs font-semibold leading-relaxed border bg-rose-500/10 border-rose-500/30 text-rose-300 flex items-center gap-2.5";
                alertMsg.innerHTML = `
                    <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 text-rose-400"></i>
                    <span>Passwords do not match. Please try again.</span>
                `;
                alertMsg.classList.remove('hidden');
                lucide.createIcons();
                return;
            }

            // Disable button and show dynamic spinner
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            submitBtn.innerHTML = `
                <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                <span>Creating Account...</span>
            `;
            lucide.createIcons();
            alertMsg.classList.add('hidden');

            try {
                // Send registration data to Node.js backend running on port 5000
                const response = await fetch("https://careercompass-ai-backend-tax8.onrender.com/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        department: department,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alertMsg.className = "p-4 rounded-xl text-xs font-semibold leading-relaxed border bg-emerald-500/10 border-emerald-500/30 text-emerald-300 flex items-center gap-2.5";
                    alertMsg.innerHTML = `
                        <i data-lucide="check-circle-2" class="w-5 h-5 shrink-0 text-emerald-400"></i>
                        <span>${data.message || "Account created successfully! Redirecting to login page..."}</span>
                    `;
                    alertMsg.classList.remove('hidden');
                    lucide.createIcons();

                    // Redirect to login page after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    alertMsg.className = "p-4 rounded-xl text-xs font-semibold leading-relaxed border bg-rose-500/10 border-rose-500/30 text-rose-300 flex items-center gap-2.5";
                    alertMsg.innerHTML = `
                        <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 text-rose-400"></i>
                        <span>${data.message || "Registration failed. Please try again."}</span>
                    `;
                    alertMsg.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                    submitBtn.innerHTML = `
                        <span>Register</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    `;
                    lucide.createIcons();
                }

            } catch (error) {
                console.error("Connection error:", error);
                alertMsg.className = "p-4 rounded-xl text-xs font-semibold leading-relaxed border bg-rose-500/10 border-rose-500/30 text-rose-300 flex items-center gap-2.5";
                alertMsg.innerHTML = `
                    <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 text-rose-400"></i>
                    <span>Cannot connect to server. Ensure your backend is running.</span>
                `;
                alertMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                submitBtn.innerHTML = `
                    <span>Register</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                `;
                lucide.createIcons();
            }
        });
    </script>
</body>

</html>
