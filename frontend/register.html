<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CareerCompass-AI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<section class="auth-section">


<div class="auth-box">


<h1>
Create Account
</h1>


<p>
Start your AI career journey
</p>



<form id="registerForm">


<label>
Full Name
</label>

<input 
type="text"
id="name"
placeholder="Enter your name"
required
>



<label>
Email
</label>

<input 
type="email"
id="email"
placeholder="Enter your email"
required
>




<label>
Department
</label>

<input 
type="text"
id="department"
placeholder="Example: Information Technology"
required
>




<label>
Password
</label>

<input 
type="password"
id="password"
placeholder="Create password"
required
>



<label>
Confirm Password
</label>

<input 
type="password"
id="confirmPassword"
placeholder="Confirm password"
required
>




<button type="submit">
Register
</button>



</form>



<p class="register-link">

Already have an account?

<a href="login.html">
Login
</a>

</p>



</div>


</section>

<script src="register.js"></script>

</body>

</html>
