<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CareerCompass-AI</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Glow Effects matching Dashboard theme */
        .neon-glow {
            box-shadow: 0 0 35px rgba(255, 42, 133, 0.25);
        }
        .neon-border {
            border: 1px solid rgba(255, 42, 133, 0.3);
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 4s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-[#0d0714] text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 selection:bg-[#ff2a85] selection:text-white relative overflow-hidden">

    <!-- Ambient Background Glows -->
    <div class="absolute top-1/4 -left-20 w-96 h-96 bg-[#ff2a85]/15 rounded-full blur-[120px] pointer-events-none animate-pulse-slow"></div>
    <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-[#7928ca]/20 rounded-full blur-[120px] pointer-events-none animate-pulse-slow"></div>

    <main class="w-full max-w-md relative z-10">

        <!-- Logo / Branding Header -->
        <div class="text-center mb-8 space-y-2">
            <div class="inline-flex p-3 rounded-2xl bg-gradient-to-br from-[#ff2a85] to-[#7928ca] text-white shadow-lg shadow-[#ff2a85]/30 mb-2">
                <i data-lucide="compass" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-extrabold tracking-wide text-white">
                CareerCompass<span class="text-[#ff2a85]">AI</span>
            </h2>
        </div>

        <!-- Auth Card Container -->
        <section class="p-8 rounded-3xl bg-[#170c28]/90 backdrop-blur-xl border border-white/10 shadow-2xl neon-glow space-y-6">

            <div class="space-y-1 text-center">
                <h1 class="text-2xl font-bold text-white tracking-tight">Reset Password</h1>
                <p class="text-slate-400 text-sm">Enter your registered email address to receive a password reset link.</p>
            </div>

            <!-- Dynamic Alert Message (Hidden by default) -->
            <div id="alert-msg" class="hidden p-4 rounded-xl text-xs font-semibold leading-relaxed transition-all"></div>

            <!-- Password Reset Form -->
            <form id="reset-form" class="space-y-5">
                <div class="space-y-2">
                    <label for="email-input" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                        Registered Email
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </div>
                        <input 
                            id="email-input"
                            type="email" 
                            placeholder="e.g. vasanth@example.com" 
                            required
                            class="w-full pl-10 pr-4 py-3 rounded-xl bg-[#10061e] border border-white/10 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-[#ff2a85] focus:ring-1 focus:ring-[#ff2a85] transition-all"
                        >
                    </div>
                </div>

                <button 
                    type="submit" 
                    id="submit-btn"
                    class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-[#ff2a85] to-[#c026d3] hover:from-[#e02376] hover:to-[#a21caf] text-white font-bold text-sm shadow-lg shadow-[#ff2a85]/25 transition-all flex items-center justify-center gap-2"
                >
                    <span>Send Reset Link</span>
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="pt-4 border-t border-white/10 text-center">
                <p class="text-xs text-slate-400">
                    Remember your password? 
                    <a href="login.html" class="font-bold text-[#ff2a85] hover:underline hover:text-[#e02376] transition-colors ml-1">
                        Back to Login
                    </a>
                </p>
            </div>

        </section>

    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Form Submit Handler
        const form = document.getElementById('reset-form');
        const alertMsg = document.getElementById('alert-msg');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email-input').value.trim();

            if (email) {
                // Disable button and show loading state
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
                submitBtn.innerHTML = `
                    <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                    <span>Sending Link...</span>
                `;
                lucide.createIcons();

                // Simulate Sending Reset Link
                setTimeout(() => {
                    alertMsg.className = "p-4 rounded-xl text-xs font-semibold leading-relaxed border bg-emerald-500/10 border-emerald-500/30 text-emerald-300 flex items-center gap-2.5";
                    alertMsg.innerHTML = `
                        <i data-lucide="check-circle-2" class="w-5 h-5 shrink-0 text-emerald-400"></i>
                        <span>Reset link sent to <strong>${email}</strong>! Redirecting to login page...</span>
                    `;
                    alertMsg.classList.remove('hidden');
                    lucide.createIcons();

                    // Redirect back to login.html after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);

                }, 1200);
            }
        });
    </script>
</body>

</html>
