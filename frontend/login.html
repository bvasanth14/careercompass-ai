<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareerCompass-AI</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- DotLottie Web Component CDN -->
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d0714; }
        ::-webkit-scrollbar-thumb { background: #2d164d; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff2a85; }

        /* Neon Glow Effects */
        .neon-border {
            border: 1px solid rgba(255, 42, 133, 0.3);
        }
        .neon-border:focus {
            border-color: #ff2a85;
            box-shadow: 0 0 15px rgba(255, 42, 133, 0.4);
            outline: none;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 4s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-[#0d0714] text-slate-100 font-sans antialiased min-h-screen overflow-y-auto flex items-center justify-center py-10 selection:bg-[#ff2a85] selection:text-white relative">

    <!-- Ambient Glow Backgrounds -->
    <div class="absolute top-10 left-10 w-96 h-96 bg-[#ff2a85]/10 rounded-full blur-[120px] pointer-events-none animate-pulse-slow"></div>
    <div class="absolute bottom-10 right-10 w-96 h-96 bg-[#c026d3]/10 rounded-full blur-[120px] pointer-events-none animate-pulse-slow"></div>

    <!-- Auth Card Container -->
    <div class="relative z-10 max-w-md w-full mx-4 p-8 rounded-3xl bg-[#170c28]/90 backdrop-blur-md border border-white/10 shadow-2xl space-y-6">
        
        <!-- Password Authentication Lottie Animation -->
        <div class="flex justify-center -mb-4">
            <dotlottie-wc 
                src="https://lottie.host/4a53e346-ef29-4988-acfe-57364a961274/A0lK8Q2qg4.lottie" 
                style="width: 130px; height: 130px;" 
                autoplay 
                loop>
            </dotlottie-wc>
        </div>

        <!-- Logo Header -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-extrabold text-white tracking-wide">
                Welcome Back to CareerCompass<span class="text-[#ff2a85]">AI</span>
            </h1>
            <p class="text-slate-400 text-sm">Login to continue your career journey</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            
            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300 block">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Enter your email" 
                    required
                    class="w-full px-4 py-3 rounded-xl bg-[#10061e] border border-white/10 text-white font-medium neon-border transition-all text-sm"
                >
            </div>

            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300 block">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password" 
                    required
                    class="w-full px-4 py-3 rounded-xl bg-[#10061e] border border-white/10 text-white font-medium neon-border transition-all text-sm"
                >
            </div>

            <div class="flex items-center justify-end text-sm">
                <a href="forgot-password.html" class="text-slate-400 hover:text-[#ff2a85] transition-colors">Forgot Password?</a>
            </div>

            <button 
                type="submit" 
                id="login-btn"
                class="w-full bg-gradient-to-r from-[#ff2a85] to-[#c026d3] hover:opacity-95 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-[#ff2a85]/30 transition-all flex items-center justify-center gap-2 text-base cursor-pointer mt-2"
            >
                Login
            </button>

        </form>

        <!-- Message Notification -->
        <p id="message" class="text-center text-sm font-medium min-h-[20px]"></p>

        <!-- Register Navigation -->
        <p class="text-center text-sm text-slate-400 pt-2 border-t border-white/10">
            Don't have an account? 
            <a href="register.html" class="text-[#ff2a85] font-semibold hover:underline ml-1">Register</a>
        </p>

    </div>

    <!-- Scripting Logic -->
    <script>
        lucide.createIcons();

        const loginForm = document.getElementById("loginForm");
        const messageEl = document.getElementById("message");
        const loginBtn = document.getElementById("login-btn");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            loginBtn.innerHTML = "Logging in...";
            loginBtn.disabled = true;
            messageEl.innerText = "";

            try {
                const response = await fetch("http://localhost:5000/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    messageEl.className = "text-center text-sm font-medium text-emerald-400 min-h-[20px]";
                    messageEl.innerText = "Login successful! Syncing profile...";
                    
                    const userId = data.student?.id || data.student?._id || data.student?.student_id;

                    // Completely wipe old browser session data first
                    localStorage.clear();

                    try {
                        // Fetch the absolute latest live record from the database to avoid stale cached metrics
                        const profileRes = await fetch(`http://localhost:5000/profile/${userId}`);
                        if (profileRes.ok) {
                            const profileData = await profileRes.json();
                            const studentObj = profileData.student || profileData;
                            if (studentObj && !studentObj.id && (studentObj._id || studentObj.student_id)) {
                                studentObj.id = studentObj._id || studentObj.student_id;
                            }
                            if (studentObj && !studentObj.id) {
                                studentObj.id = userId || ('usr_' + Date.now());
                            }
                            localStorage.setItem("student", JSON.stringify(studentObj));
                        } else {
                            const studentObj = data.student || {};
                            if (studentObj && !studentObj.id && (studentObj._id || studentObj.student_id)) {
                                studentObj.id = studentObj._id || studentObj.student_id;
                            }
                            if (studentObj && !studentObj.id) {
                                studentObj.id = userId || ('usr_' + Date.now());
                            }
                            localStorage.setItem("student", JSON.stringify(studentObj));
                        }
                    } catch (fetchErr) {
                        // Fallback to login response payload if profile fetch fails
                        const studentObj = data.student || {};
                        if (studentObj && !studentObj.id && (studentObj._id || studentObj.student_id)) {
                            studentObj.id = studentObj._id || studentObj.student_id;
                        }
                        if (studentObj && !studentObj.id) {
                            studentObj.id = userId || ('usr_' + Date.now());
                        }
                        localStorage.setItem("student", JSON.stringify(studentObj));
                    }

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 800);
                } else {
                    messageEl.className = "text-center text-sm font-medium text-rose-400 min-h-[20px]";
                    messageEl.innerText = data.message || "Invalid credentials";
                    loginBtn.innerHTML = "Login";
                    loginBtn.disabled = false;
                }

            } catch (error) {
                console.log(error);
                messageEl.className = "text-center text-sm font-medium text-rose-400 min-h-[20px]";
                messageEl.innerText = "Cannot connect to server";
                loginBtn.innerHTML = "Login";
                loginBtn.disabled = false;
            }
        });
    </script>

</body>

</html>
